  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

<body>
  <header id="site-header" class="site-header">
    <div class="container bar"><a class="brand" href="index.html"><img class="site-logo" src="assets/img/logo-5dwn.png" alt="5DWN" width="1220" height="293"></a></div>
  </header>

  <main>
    <div class="container">
      <header class="page-head">
        <span class="eyebrow">Area riservata · non in menu</span>
        <h1>Studio</h1>
        <p>Generatore di grafiche 5DWN dai dati ESPN. Scegli la settimana, controlla l'anteprima e scarica il PNG.</p>
      </header>

      <div class="studio-controls">
        <label class="select-field">
          <span class="select-label">Settimana</span>
          <span class="select-wrap"><select id="week-select" class="select" aria-label="Settimana"></select></span>
        </label>
        <span class="studio-status" id="studio-status" role="status"></span>
      </div>

      <section class="studio-block">
        <div class="section-head">
          <div><span class="eyebrow">Calendario settimanale</span><h2>16:9 · 1920 × 1080</h2></div>
          <div class="studio-actions"><button type="button" class="btn btn-primary" id="dl-wide">Scarica PNG 16:9</button></div>
        </div>
        <div class="gfx-preview" id="preview-wide"><div class="gfx-scaler"><div class="gfx" id="gfx-wide"></div></div></div>
      </section>

      <section class="studio-block">
        <div class="section-head">
          <div><span class="eyebrow">Calendario settimanale</span><h2>9:16 · 1080 × 1920 · storia IG</h2></div>
          <div class="studio-actions"><button type="button" class="btn btn-primary" id="dl-tall">Scarica PNG 9:16</button></div>
        </div>
        <div class="gfx-preview portrait" id="preview-tall"><div class="gfx-scaler"><div class="gfx" id="gfx-tall"></div></div></div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="assets/js/pages/studio.js?v=202610021733"></script>
