<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script>try{var t=localStorage.getItem("5dwn-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Statistiche NFL · 5DWN</title>
  <meta name="description" content="Statistiche NFL della stagione: classifiche complete individuali e di squadra.">
  <meta name="theme-color" content="#0a1730">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="5DWN">
  <meta property="og:title" content="Statistiche NFL · 5DWN">
  <meta property="og:description" content="Classifiche complete individuali e di squadra.">
  <meta property="og:image" content="assets/img/logo-5dwn.png">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="preconnect" href="https://site.api.espn.com" crossorigin>
  <link rel="preconnect" href="https://a.espncdn.com">
  <link rel="stylesheet" href="assets/css/style.css?v=202610022012">
</head>
<body>
  <header id="site-header" class="site-header">
    <div class="container bar"><a class="brand" href="index.html"><img class="site-logo" src="assets/img/logo-5dwn.png" alt="5DWN" width="1220" height="293"></a></div>
  </header>

  <main>
    <div class="container">
      <header class="page-head">
        <span class="eyebrow" id="season-label">Stagione NFL</span>
        <h1>Statistiche</h1>
        <p>Classifiche complete della stagione: tutti i giocatori e tutte le squadre con dati disponibili. Tocca un nome per il profilo.</p>
      </header>

      <div class="stats-controls">
        <div class="segmented" id="mode-toggle" role="group" aria-label="Tipo di statistiche">
          <button type="button" data-mode="players" aria-pressed="true">Individuali</button>
          <button type="button" data-mode="teams" aria-pressed="false">Squadra</button>
        </div>
        <label class="select-field">
          <span class="select-label">Statistica</span>
          <span class="select-wrap"><select id="stat-select" class="select"></select></span>
        </label>
      </div>

      <section class="section rank-section">
        <div class="section-head"><div><span class="eyebrow" id="rank-eyebrow"></span><h2 id="rank-title">Statistica</h2></div><span class="count" id="rank-count"></span></div>
        <div id="ranking"><div class="state" role="status"><div class="spinner"></div>Caricamento della classifica…</div></div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <noscript><div class="container state">Per vedere le statistiche aggiornate attiva JavaScript.</div></noscript>
  <script>
    /* Se lo script della pagina non parte (file vecchi in cache, rete, estensioni del browser)
       mostriamo l'errore invece di lasciare la pagina vuota. */
    (function () {
      function fail(msg) {
        var b = document.getElementById("ranking");
        if (!b || b.querySelector(".ld-row") || b.querySelector(".state.error")) return;
        b.innerHTML = '<div class="state error" role="alert"><span class="label">Errore di caricamento</span>' +
          '<p><strong>La pagina Statistiche non si è avviata.</strong><br>Dettaglio: ' + String(msg).replace(/[<>&]/g, "") + '</p>' +
          '<p>Chiudi la scheda e riapri la pagina, oppure premi Cmd+Shift+R.</p></div>';
      }
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t.tagName && t.tagName !== "SCRIPT") return; // immagini e loghi hanno già un ripiego
        fail((e.message || "file non caricato") + (t && t.src ? " (" + t.src.split("/").pop() + ")" : e.filename ? " (" + e.filename.split("/").pop() + ")" : ""));
      }, true);
      window.addEventListener("unhandledrejection", function (e) { fail(e.reason && e.reason.message ? e.reason.message : e.reason); });
      setTimeout(function () {
        var b = document.getElementById("ranking");
        if (b && b.querySelector(".spinner") && !window.__5dwnStatsStarted) fail("lo script non è partito entro 15 secondi");
      }, 15000);
    })();
  </script>
  <script type="module" src="assets/js/pages/statistiche.js?v=202610022012"></script>
</body>
</html>
